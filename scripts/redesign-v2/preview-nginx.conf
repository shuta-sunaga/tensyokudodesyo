# =============================================================
# デザイン v2 プレビュー環境（社内確認用・Basic 認証・noindex）
#   URL : https://www.tensyokudodesyo.com:8443/
#   root: /var/www/preview-v2（本番 /var/www/html のコピー + v2 の静的ファイル + 生成ページ）
#   設置: /etc/nginx/conf.d/preview-v2.conf（scripts/redesign-v2/deploy-preview.sh --setup が配置）
#   撤去: このファイルを削除して nginx reload、SG の 8443 を閉じる
# =============================================================
server {
    listen 8443 ssl;
    server_name tensyokudodesyo.com www.tensyokudodesyo.com;
    root /var/www/preview-v2;
    index index.html;

    auth_basic "Design v2 Preview";
    auth_basic_user_file /etc/nginx/.htpasswd-preview;

    location / {
        try_files $uri $uri/ =404;
    }
    # キャッシュ: JSON は 10 分（MT 再構築後も次の再取得で更新）、CSS/JS は 1 時間（?v= で更新）、画像は 30 日
    location ^~ /data/ { expires 10m; }
    location ~* .(?:css|js)$ { expires 1h; }
    location ~* .(?:webp|png|jpg|jpeg|gif|svg|ico|woff2?)$ { expires 30d; }
    error_page 404 /404.html;
    # ブラウザは manifest を認証なしで取りに来るため 401 を避ける
    location = /site.webmanifest { auth_basic off; }

    # 検索エンジンに載せない・計測しない・プレビューであることを明示
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    sub_filter_once off;
    sub_filter '<script async src="https://www.googletagmanager.com/gtag/js?id=G-GJSD6BRJ0T"></script>' '<!-- GA disabled (preview) -->';
    sub_filter '</body>' '<div style="position:fixed;left:12px;bottom:12px;z-index:99999;background:#1B2430;color:#fff;font:700 11px/1 sans-serif;letter-spacing:.08em;padding:9px 12px;border-left:4px solid #F5820D;pointer-events:none">PREVIEW ／ 非公開</div></body>';

    # 本番と同じセキュリティヘッダ
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://challenges.cloudflare.com https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://2kyofn1cn7.execute-api.ap-northeast-1.amazonaws.com https://challenges.cloudflare.com https://www.google-analytics.com https://*.google-analytics.com; frame-src 'self' https://challenges.cloudflare.com https://sjpfkixxkhe8.jp.larksuite.com; frame-ancestors 'self'; form-action 'self' https://2kyofn1cn7.execute-api.ap-northeast-1.amazonaws.com; base-uri 'self'; object-src 'self'; upgrade-insecure-requests" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    ssl_certificate /etc/letsencrypt/live/tensyokudodesyo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tensyokudodesyo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
