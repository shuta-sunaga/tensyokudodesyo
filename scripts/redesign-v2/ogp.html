<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@600&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #1B2430; font-family: "Noto Sans JP", sans-serif; }
  .card { position: relative; width: 1200px; height: 630px; overflow: hidden; }
  .card img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 60% center; }
  .card::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(14,20,28,.86) 0%, rgba(14,20,28,.62) 45%, rgba(14,20,28,.12) 100%), linear-gradient(0deg, rgba(14,20,28,.7) 0%, rgba(14,20,28,.1) 50%, rgba(14,20,28,.35) 100%); }
  .in { position: absolute; inset: 0; z-index: 2; padding: 56px 64px 60px; display: flex; flex-direction: column; justify-content: space-between; }
  .logo { display: inline-flex; align-items: center; background: #fff; padding: 12px 18px; align-self: flex-start; }
  .logo img { height: 46px; width: auto; display: block; }
  .tag { display: flex; align-items: center; gap: 14px; font-family: "IBM Plex Sans", sans-serif; font-size: 18px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: #F5820D; margin-bottom: 18px; }
  .tag i { width: 40px; height: 3px; background: #F5820D; }
  h1 { color: #fff; font-size: 74px; line-height: 1.25; letter-spacing: .03em; font-weight: 700; text-shadow: 0 2px 24px rgba(0,0,0,.35); }
  p { margin-top: 20px; color: #E6EAEE; font-size: 24px; font-weight: 500; letter-spacing: .02em; text-shadow: 0 1px 12px rgba(0,0,0,.4); }
  .strip { position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: linear-gradient(90deg, #F5820D 0 34%, transparent 34%); z-index: 3; }
</style>
</head>
<body>
<div class="card">
  <img class="bg" src="../../public_html/assets/v2/hero-main.webp" alt="">
  <div class="in">
    <span class="logo"><img src="../../public_html/assets/logo.webp" alt="転職どうでしょう"></span>
    <div>
      <div class="tag"><i></i>Manufacturing Career Support ／ All 47 Prefectures</div>
      <h1>地元で、<br>ものづくりの仕事を。</h1>
      <p>製造業に強い、地域密着の転職支援。相談・面談は無料です。</p>
    </div>
  </div>
  <div class="strip"></div>
</div>
</body>
</html>
